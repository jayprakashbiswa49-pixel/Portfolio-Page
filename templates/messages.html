<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Messages | Jayprakash</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .message {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .message h3 {
            margin-top: 0;
        }

        .message p {
            margin: 8px 0;
        }

        .empty {
            text-align: center;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Contact Messages</h1>

    {% if messages %}

        {% for msg in messages %}

        <div class="message">

            <h3>{{ msg["Name"] }}</h3>

            <p>
                <strong>Email:</strong>
                {{ msg["Email"] }}
            </p>

            <p>
                <strong>Subject:</strong>
                {{ msg["Subject"] }}
            </p>

            <p>
                <strong>Message:</strong>
                {{ msg["Message"] }}
            </p>

            <p>
                <strong>Date:</strong>
                {{ msg["Date"] }}
            </p>

        </div>

        {% endfor %}

    {% else %}

        <p class="empty">
            No messages yet.
        </p>

    {% endif %}

</body>

</html>
